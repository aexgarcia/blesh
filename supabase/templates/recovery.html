<!doctype html>
<html lang="es">
  <body style="margin:0;padding:32px 16px;background:#f8f5f6;font-family:Inter,Arial,sans-serif;color:#0b0d12">
    <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px">
      <tr><td>
        <p style="margin:0 0 24px;font-size:24px;font-weight:900;font-style:italic;letter-spacing:-0.04em">blesh</p>
        <h1 style="margin:0 0 12px;font-size:18px">Restablecer contraseña</h1>
        <p style="margin:0 0 24px;font-size:14px;line-height:1.5;color:#6d6b6c">
          Recibimos una solicitud para restablecer tu contraseña de administración. Después de cambiarla
          se pedirá tu código de verificación en dos pasos.
        </p>
        <a href="{{ .SiteURL }}/admin/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
           style="display:inline-block;padding:14px 28px;border-radius:999px;background:#0b0d12;color:#ffffff;font-size:12px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;text-decoration:none">
          Crear nueva contraseña
        </a>
        <p style="margin:24px 0 0;font-size:12px;color:#6d6b6c">Si no lo solicitaste, ignora este correo; tu contraseña no cambiará.</p>
      </td></tr>
    </table>
  </body>
</html>
